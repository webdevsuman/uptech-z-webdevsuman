<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Linear Gradient matching the logo red -> orange fill -->
    <linearGradient id="uptechGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="40%" stop-color="#FF5238" />
      <stop offset="80%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#FFA24A" />
    </linearGradient>
  </defs>

  <!-- Scalable Text Logo with rounded font styling -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="url(#uptechGradient)" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Arial Rounded MT Bold', sans-serif" 
    font-weight="800" 
    font-size="76" 
    letter-spacing="-1">
    Uptech-Z
  </text>
</svg>
